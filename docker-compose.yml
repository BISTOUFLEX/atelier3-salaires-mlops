services:
  api:
    build: .
    ports:
      - "8000:8000"

  mlflow:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    command: mlflow ui --backend-store-uri file:/app/mlruns --host 0.0.0.0 --port 5000

  logs:
    image: amir20/dozzle:latest
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
