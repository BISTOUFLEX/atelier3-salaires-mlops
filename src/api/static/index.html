<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prédiction de salaire — Insee EQTP</title>
<style>
  :root {
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  p.subtitle {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin: 16px 0 6px;
  }
  select, input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: var(--card);
    color: var(--text);
  }
  select:focus, input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { background: var(--muted); cursor: not-allowed; }
  .result {
    margin-top: 24px;
    padding: 20px;
    border-radius: 12px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    text-align: center;
    display: none;
  }
  .result.visible { display: block; }
  .result .amount {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent-dark);
  }
  .result .model {
    margin-top: 4px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .error {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    font-size: 0.85rem;
    display: none;
  }
  .error.visible { display: block; }
  footer {
    margin-top: 20px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <h1>Prédiction de salaire</h1>
    <p class="subtitle">Salaire net mensuel moyen EQTP, secteur privé (données Insee)</p>

    <form id="predict-form">
      <label for="sex">Sexe</label>
      <select id="sex" required>
        <option value="F">Femme</option>
        <option value="M">Homme</option>
      </select>

      <label for="pcs">Catégorie socioprofessionnelle</label>
      <select id="pcs" required>
        <option value="1T3">Cadres</option>
        <option value="4">Professions intermédiaires</option>
        <option value="5">Employés</option>
        <option value="6">Ouvriers</option>
      </select>

      <label for="department">Département</label>
      <input id="department" type="text" placeholder="75" maxlength="3" required>

      <label for="year">Année</label>
      <input id="year" type="number" min="2000" max="2100" value="2024" required>

      <button type="submit" id="submit-btn">Prédire le salaire</button>
    </form>

    <div class="result" id="result">
      <div class="amount" id="amount"></div>
      <div class="model" id="model-used"></div>
    </div>

    <div class="error" id="error"></div>

    <footer>API : <a href="/docs">documentation Swagger</a></footer>
  </div>

<script>
  const form = document.getElementById("predict-form");
  const submitBtn = document.getElementById("submit-btn");
  const resultBox = document.getElementById("result");
  const amountEl = document.getElementById("amount");
  const modelEl = document.getElementById("model-used");
  const errorBox = document.getElementById("error");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    resultBox.classList.remove("visible");
    errorBox.classList.remove("visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "Calcul en cours...";

    const payload = {
      sex: document.getElementById("sex").value,
      pcs: document.getElementById("pcs").value,
      department: document.getElementById("department").value.trim(),
      year: Number(document.getElementById("year").value),
    };

    try {
      const response = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.detail ? JSON.stringify(body.detail) : `Erreur ${response.status}`);
      }

      const data = await response.json();
      amountEl.textContent = data.predicted_salary.toLocaleString("fr-FR", {
        style: "currency",
        currency: "EUR",
        maximumFractionDigits: 0,
      });
      modelEl.textContent = `Modèle : ${data.model_used}`;
      resultBox.classList.add("visible");
    } catch (err) {
      errorBox.textContent = err.message || "Une erreur est survenue.";
      errorBox.classList.add("visible");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Prédire le salaire";
    }
  });
</script>
</body>
</html>
